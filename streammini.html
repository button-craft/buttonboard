<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#121212">
<link rel="icon" href="img/logo.jpeg">
<title>BUTTIFY Mini</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:   #121212; --bg2:  #181818; --bg3:  #242424; --bg4:  #282828;
  --fg:   #ffffff; --fg2:  #b3b3b3; --fg3:  #6a6a6a;
  --acc:  #ff3d3d; --acc2: #ff6565;
  --ln:   rgba(255,255,255,0.1); --ph: 88px;
}
html { font-size: 16px; }
body { background:var(--bg); color:var(--fg); font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif; min-height:100vh; overflow-x:hidden; }
button { font-family:inherit; }
img { display:block; }
::-webkit-scrollbar { width:5px; }
::-webkit-scrollbar-thumb { background:#444; border-radius:3px; }

#topBar { position:sticky; top:0; z-index:100; background:rgba(18,18,18,.93); backdrop-filter:blur(14px); border-bottom:1px solid var(--ln); height:62px; display:flex; align-items:center; gap:14px; padding:0 24px; }
.logo-text { font-size:17px; font-weight:700; color:var(--acc); white-space:nowrap; }
.logo-text span { color:var(--fg); }
.logo-mini { font-size:11px; font-weight:700; color:var(--fg3); letter-spacing:.1em; text-transform:uppercase; margin-left:2px; }

#main { padding:0 24px calc(var(--ph) + 28px); max-width:640px; margin:0 auto; }

.hero { margin:36px -24px 0; padding:60px 24px 28px; position:relative; overflow:hidden; }
.hero-grad { position:absolute; inset:0; pointer-events:none; background:linear-gradient(180deg,#1a1a32 0%,transparent 100%); }
.hero > *:not(.hero-grad) { position:relative; }
.hero-eyebrow { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.12em; color:var(--fg2); margin-bottom:6px; }
.hero-title { font-size:clamp(26px,6vw,46px); font-weight:700; line-height:1.05; margin-bottom:10px; }
.hero-meta { font-size:14px; color:var(--fg2); }
.hero-meta b { color:var(--fg); }

.tl-head { display:grid; grid-template-columns:38px 1fr 34px; gap:10px; padding:16px 10px 6px; color:var(--fg2); font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; border-bottom:1px solid var(--ln); margin-bottom:4px; }
.tr { display:grid; grid-template-columns:38px 1fr 34px; gap:10px; padding:9px 10px; border-radius:6px; cursor:pointer; transition:background .1s; align-items:center; }
.tr:hover { background:var(--bg4); }
.tr.playing { background:var(--bg3); }
.tr-num { font-size:14px; color:var(--fg2); text-align:center; display:flex; align-items:center; justify-content:center; height:20px; position:relative; }
.tr-num-n { transition:opacity .1s; }
.tr-num-pl { position:absolute; opacity:0; transition:opacity .1s; display:flex; }
.tr:hover .tr-num-n { opacity:0; }
.tr:hover .tr-num-pl { opacity:1; }
.tr.playing .tr-num-n { opacity:0; }
.tr.playing .tr-num-pl { opacity:1; }
.tr.playing .tr-num-pl svg { color:var(--acc); }
.tr-art { width:44px; height:44px; border-radius:4px; object-fit:cover; margin-right:6px; background:var(--bg4); }
.tr-info { min-width:0; display:flex; align-items:center; gap:12px; }
.tr-titlewrap { min-width:0; }
.tr-title { font-size:15px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tr.playing .tr-title { color:var(--acc); }
.tr-artist { font-size:12px; color:var(--fg2); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

#player { position:fixed; bottom:0; left:0; right:0; height:var(--ph); background:#161616; border-top:1px solid var(--ln); z-index:200; display:flex; align-items:center; gap:10px; padding:0 16px; }
.pl-track { display:flex; align-items:center; gap:10px; flex:1.2; min-width:0; }
.pl-art { width:54px; height:54px; border-radius:4px; object-fit:cover; flex-shrink:0; background:var(--bg4); }
.pl-info { min-width:0; }
.pl-title { font-size:14px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pl-artist { font-size:12px; color:var(--fg2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
.pl-idle { color:var(--fg3); font-size:14px; }
.pl-ctrl { display:flex; flex-direction:column; align-items:center; gap:4px; flex:2; max-width:500px; }
.pl-btns { display:flex; align-items:center; gap:8px; }
.pb { background:none; border:none; cursor:pointer; color:var(--fg2); display:flex; align-items:center; justify-content:center; padding:5px; border-radius:50%; transition:color .12s,transform .1s; font-size:18px; }
.pb:hover { color:var(--fg); transform:scale(1.1); }
.pb:disabled { opacity:.3; cursor:default; }
.pb:disabled:hover { transform:none; color:var(--fg2); }
#ppBtn { width:35px; height:35px; background:var(--fg); border-radius:50%; color:var(--bg); font-size:14px; }
#ppBtn:hover { background:#e8e8e8; color:var(--bg); transform:scale(1.06); }
#ppBtn:disabled { background:var(--fg3); }
.pl-prog { display:flex; align-items:center; gap:8px; width:100%; }
.pl-t { font-size:11px; color:var(--fg2); font-variant-numeric:tabular-nums; min-width:30px; }
.pl-t.r { text-align:right; }
.prog-bg { flex:1; height:4px; background:var(--bg4); border-radius:2px; cursor:pointer; transition:height .12s; }
.prog-bg:hover { height:6px; }
.prog-fill { height:100%; background:var(--acc); border-radius:2px; width:0; transition:width .08s linear; pointer-events:none; }
.prog-bg:hover .prog-fill { background:var(--acc2); }
.pl-right { flex:1; }

@media (max-width:640px) {
  #topBar { padding:0 14px; gap:10px; }
  #main { padding:0 14px calc(var(--ph) + 16px); }
  .hero { margin:20px -14px 0; padding:36px 14px 20px; }
  .tl-head { display:none; }
  .pl-right { display:none; }
}
</style>
</head>
<body>

<header id="topBar">
  <span class="logo-text">BUTTI<span>FY</span></span><span class="logo-mini">Mini</span>
</header>

<main id="main">
  <div class="hero"><div class="hero-grad"></div><div class="hero-eyebrow">Playlist</div><div class="hero-title">Mini Drops</div><div class="hero-meta">Ray, EJ, Ryan &amp; Jackbox</div></div>
  <div class="tl-head"><span>#</span><span>TITLE</span><span></span></div>
  <div id="trackList"></div>
</main>

<div id="player">
  <div class="pl-track">
    <img class="pl-art" id="plArt" src="" alt="" style="display:none">
    <div class="pl-info">
      <div class="pl-title" id="plTitle"><span class="pl-idle">Select a track to play</span></div>
      <div class="pl-artist" id="plArtist"></div>
    </div>
  </div>
  <div class="pl-ctrl">
    <div class="pl-btns">
      <button class="pb" id="prevBtn" title="Previous" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6L20 18V6z"/></svg></button>
      <button class="pb" id="ppBtn" title="Play/Pause" disabled>
        <svg id="icPlay" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
        <svg id="icPause" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      </button>
      <button class="pb" id="nextBtn" title="Next" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm2-8.14L11.03 12 8 14.14V9.86zM16 6h2v12h-2z"/></svg></button>
    </div>
    <div class="pl-prog">
      <span class="pl-t" id="tCur">0:00</span>
      <div class="prog-bg" id="progBg"><div class="prog-fill" id="progFill"></div></div>
      <span class="pl-t r" id="tDur">0:00</span>
    </div>
  </div>
  <div class="pl-right"></div>
</div>

<script>
const TRACKS = [
  {title:'JIG (Janna is a Hoe)',        artist:'Ray, EJ & Ryan', cover:'img/JIG.png',     src:'JIG.mp3'},
  {title:'JIG (Holiday Remix)',         artist:'Ray, EJ & Ryan', cover:'img/jigchr.png',  src:'JIG (Holiday Remix).wav'},
  {title:'Bros No Hoes',                artist:'Jackbox',        cover:'img/IMG_1640.png', src:'Hoes final.wav'},
];

const audio = new Audio();
const S = { idx:-1, playing:false };

const fmt = s => isFinite(s) ? `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}` : '0:00';

function play(i) {
  const t = TRACKS[i];
  audio.pause(); audio.src = t.src;
  S.idx = i; S.playing = true;
  audio.play().catch(()=>{});
  renderPlayer(); highlightTracks();
}
function next() { if (S.idx < TRACKS.length-1) play(S.idx+1); }
function prev() {
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  if (S.idx > 0) play(S.idx-1);
}
function renderPlayer() {
  const t = S.idx >= 0 ? TRACKS[S.idx] : null;
  const art = document.getElementById('plArt');
  art.src = t ? t.cover : ''; art.style.display = t ? 'block' : 'none';
  document.getElementById('plTitle').innerHTML = t ? t.title : '<span class="pl-idle">Select a track to play</span>';
  document.getElementById('plArtist').textContent = t ? t.artist : '';
  document.getElementById('ppBtn').disabled = !t;
  document.getElementById('prevBtn').disabled = S.idx <= 0 && audio.currentTime <= 3;
  document.getElementById('nextBtn').disabled = S.idx < 0 || S.idx >= TRACKS.length-1;
  document.getElementById('icPlay').style.display = S.playing ? 'none' : '';
  document.getElementById('icPause').style.display = S.playing ? '' : 'none';
}
function highlightTracks() {
  document.querySelectorAll('.tr').forEach((r,i)=>r.classList.toggle('playing', i===S.idx));
}
function renderList() {
  const list = document.getElementById('trackList');
  TRACKS.forEach((t,i)=>{
    const row = document.createElement('div');
    row.className = 'tr';
    row.innerHTML = `<div class="tr-num"><span class="tr-num-n">${i+1}</span><span class="tr-num-pl"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg></span></div><div class="tr-info"><img class="tr-art" src="${t.cover}" alt=""><div class="tr-titlewrap"><div class="tr-title">${t.title}</div><div class="tr-artist">${t.artist}</div></div></div><div></div>`;
    row.addEventListener('click', ()=>play(i));
    list.appendChild(row);
  });
}

audio.addEventListener('timeupdate', ()=>{
  const d = audio.duration;
  document.getElementById('tCur').textContent = fmt(audio.currentTime);
  document.getElementById('progFill').style.width = d>0 ? `${(audio.currentTime/d)*100}%` : '0%';
});
audio.addEventListener('loadedmetadata', ()=>document.getElementById('tDur').textContent = fmt(audio.duration));
audio.addEventListener('play', ()=>{ S.playing = true; renderPlayer(); });
audio.addEventListener('pause', ()=>{ S.playing = false; renderPlayer(); });
audio.addEventListener('ended', ()=>{ S.playing = false; if (S.idx < TRACKS.length-1) next(); else { renderPlayer(); highlightTracks(); } });

const progBg = document.getElementById('progBg');
function seekAt(e) {
  const rect = progBg.getBoundingClientRect();
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
  audio.currentTime = Math.max(0, Math.min(1, x/rect.width)) * audio.duration;
}
progBg.addEventListener('click', seekAt);
progBg.addEventListener('touchstart', e=>{ e.preventDefault(); seekAt(e); }, {passive:false});

document.getElementById('ppBtn').addEventListener('click', ()=>{ if (S.idx<0) return; audio.paused ? audio.play() : audio.pause(); });
document.getElementById('prevBtn').addEventListener('click', prev);
document.getElementById('nextBtn').addEventListener('click', next);

renderList();
renderPlayer();
</script>
</body>
</html>
